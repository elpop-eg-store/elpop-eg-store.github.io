/* ---- ELPOP v2 additions ---- */
html.elp-dark,html.elp-dark body{background:#0b0b0b}
html.elp-dark #root{filter:invert(.92) hue-rotate(180deg)}
html.elp-dark #root img,html.elp-dark #root video{filter:invert(1) hue-rotate(180deg)}
.group{border-radius:14px;overflow:hidden}
button:not(.rounded-full){border-radius:12px}
dialog{border-radius:16px;border:0;overflow:auto}
.elp-chips{display:flex;flex-wrap:wrap;gap:8px}
.elp-chip{padding:7px 12px;font-size:12px;font-weight:800;background:#f4f4f5;color:#3f3f46;border-radius:999px!important}
.elp-chip.on{background:#0a0a0a;color:#fff}
.elp-more{display:flex;flex-direction:column;align-items:center;gap:10px;margin:28px 0}
.elp-more-t{font-size:12px;font-weight:700;color:#71717a}
.elp-btn-dark,.elp-btn-red,.elp-btn-light{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 22px;font-weight:900;font-size:13px;border:0;cursor:pointer;margin-top:8px}
.elp-btn-dark{background:#0a0a0a;color:#fff}.elp-btn-red{background:#ff2e00;color:#fff;width:100%}.elp-btn-light{background:#fff;color:#0a0a0a}
.elp-sale{background:#0a0a0a;color:#fff;margin:40px 0}
.elp-sale-in{max-width:1280px;margin:0 auto;padding:36px 20px;display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between}
.elp-sale-k{color:#ff2e00;font-weight:900;font-size:12px;letter-spacing:.08em}
.elp-sale-h{font-size:clamp(22px,4vw,36px);font-weight:900;margin:6px 0 10px}
.elp-cd{display:flex;gap:10px}
.elp-cd-b{background:#1c1c1c;border-radius:14px;min-width:68px;padding:12px 8px;text-align:center}
.elp-cd-b b{display:block;font-size:28px;font-weight:900}.elp-cd-b span{font-size:11px;color:#a1a1aa}
.elp-look{max-width:1280px;margin:48px auto;padding:0 20px}
.elp-h2{font-size:clamp(22px,3.5vw,32px);font-weight:900;margin-bottom:20px}
.elp-look-g{display:grid;gap:20px}
@media(min-width:800px){.elp-look-g{grid-template-columns:1fr 1fr}}
.elp-look-img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:16px;max-height:560px}
.elp-look-l{display:flex;flex-direction:column;gap:12px;justify-content:center}
.elp-look-r{display:flex;align-items:center;gap:12px;border:1px solid #e5e5e5;border-radius:14px;padding:10px}
.elp-look-r img{width:72px;height:88px;object-fit:cover;border-radius:10px;cursor:pointer}
.elp-look-n{flex:1;display:flex;flex-direction:column;gap:4px;font-size:14px}
.elp-look-n span{color:#52525b;font-weight:700}
.elp-notify{margin-top:14px;padding:10px 14px;background:#fff4f0;border-radius:12px;font-size:13px;font-weight:700}
.elp-fit{max-width:420px;margin-bottom:28px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.elp-fit-r{display:flex;align-items:center;gap:10px}.elp-fit-r span{width:90px}
.elp-fit-r i{flex:1;height:8px;background:#eee;border-radius:99px;overflow:hidden;display:block}
.elp-fit-r u{display:block;height:8px;background:#ff2e00;text-decoration:none}
.elp-fit-r em{width:40px;font-style:normal;font-weight:800}
.elp-nf{text-align:center;padding:90px 20px}.elp-nf-n{font-size:96px;font-weight:900;color:#ff2e00;line-height:1}
.elp-nf h1{font-size:24px;font-weight:900;margin:10px 0 16px}
.elp-qv{display:grid}@media(min-width:640px){.elp-qv{grid-template-columns:1fr 1fr}}
.elp-qv img{width:100%;height:100%;max-height:420px;object-fit:cover}
.elp-qv-b{padding:20px;position:relative;display:flex;flex-direction:column;gap:6px}
.elp-qv-x{position:absolute;top:8px;inset-inline-end:10px;font-size:28px;background:none;border:0;cursor:pointer}
.elp-qv-b h3{font-weight:900;font-size:18px;padding-inline-end:28px}.elp-qv-p{font-weight:900;font-size:18px}.elp-qv-p s{color:#a1a1aa;font-size:13px;font-weight:600}
.elp-qv-b p{font-size:13px;color:#52525b}.elp-qv-s{display:flex;flex-wrap:wrap;gap:6px}
.elp-qv-s span{border:1px solid #d4d4d8;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700}.elp-qv-s .out{text-decoration:line-through;color:#d4d4d8}

@media print{body *{visibility:hidden}.elp-invoice,.elp-invoice *{visibility:visible}.elp-invoice-wrap{position:absolute;inset:0;background:#fff!important;overflow:visible}.elp-noprint{display:none!important}}
.elp-chart{width:100%;max-width:520px;max-height:220px;display:block;margin:0 auto}

.elp-swatch{width:56px;height:44px;border:1px solid #d4d4d4;padding:2px;background:#fff;cursor:pointer}
.elp-imggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.elp-imgthumb{width:100%;height:150px;object-fit:cover;background:#f5f5f5;border:1px solid #e5e5e5;display:block}
.elp-logobox{background:#0A0A0A;padding:10px 16px;display:flex;align-items:center;min-height:56px}
.elp-search{max-width:320px}
.elp-promo{position:relative;min-height:320px;overflow:hidden;background:#0A0A0A;color:#fff}
.elp-promo>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.6}
